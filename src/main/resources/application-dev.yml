server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: "${DB_PASSWORD:aryan@2006}"

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:test-client-id}"
            client-secret: "${GOOGLE_CLIENT_SECRET:test-client-secret}"
            scope:
              - email
              - profile
              - openid

logging:
  level:
    org.springframework.security: DEBUG

# Custom security configuration properties
security:
  jwt:
    secret: "${JWT_SECRET:v9B2x7KmQ5zW3pG8sN1vC4xZ6mK9qL2jR5wT8yU1iO4p7a3s6d9fG2h5j8k1m3n5}"
    issuer: "${JWT_ISSUER:api.substring.com}"
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}